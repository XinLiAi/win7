name: Build Windows EXE + Installer

# ============================================================
#  在 GitHub 云端自动打包 Windows EXE + 一键安装包（免费，无需本机 Windows）
# ============================================================
#  使用步骤：
#  1. 把本项目文件上传到一个 GitHub 仓库（公开或私有均可）
#  2. 本文件放到仓库 .github/workflows/build_exe.yml
#  3. 仓库页面 -> Actions -> 左侧 "Build Windows EXE + Installer"
#     -> 右上角 "Run workflow" -> 绿色按钮
#  4. 等约 3-5 分钟 -> 打开本次运行 -> Artifacts
#     -> 下载 DeviceManager-package.zip，里面含 EXE 和安装包
# ============================================================

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查文件（调试用）
        shell: cmd
        run: |
          echo === 当前目录文件列表 ===
          dir /b
          echo.
          echo === 检查关键文件 ===
          if exist device_manager.py (echo [OK] device_manager.py) else (echo [缺失] device_manager.py)
          if exist device_manager.spec (echo [OK] device_manager.spec) else (echo [缺失] device_manager.spec)
          if exist device_manager_installer.iss (echo [OK] device_manager_installer.iss) else (echo [缺失] device_manager_installer.iss)
          if exist device_manager.ico (echo [OK] device_manager.ico) else (echo [提示] device_manager.ico 不存在，将使用默认图标)

      - name: 安装 Python（3.8 是最后一个支持 Win7 的版本）
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 安装打包依赖（固定版本，确保 Win7 兼容）
        run: |
          python -m pip install --upgrade "pip<24"
          pip install pyinstaller==5.13.2 openpyxl==3.1.2

      - name: 打包 EXE（单文件、无控制台、带图标）
        run: python -m PyInstaller --noconfirm --clean device_manager.spec

      - name: 安装 Inno Setup（生成一键安装包）
        run: choco install innosetup -y --no-progress
        continue-on-error: true

      - name: 编译安装包
        shell: cmd
        continue-on-error: true
        run: |
          if exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" device_manager_installer.iss
          ) else if exist "C:\Program Files\Inno Setup 6\ISCC.exe" (
            "C:\Program Files\Inno Setup 6\ISCC.exe" device_manager_installer.iss
          ) else (
            echo [警告] 未找到 ISCC.exe，跳过安装包生成（EXE 仍可正常下载）
          )

      - name: 上传产物（EXE + 安装包）
        uses: actions/upload-artifact@v4
        with:
          name: DeviceManager-package
          path: |
            dist/DeviceManager.exe
            Output/*.exe
          if-no-files-found: error
